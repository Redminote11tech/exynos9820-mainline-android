[constants]
ndk_path = '/opt/android-ndk'
toolchain = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
ar = toolchain / 'llvm-ar'
c = [toolchain / 'aarch64-linux-android35-clang', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
cpp = [toolchain / 'aarch64-linux-android35-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
c_ld = 'lld'
cpp_ld = 'lld'
strip = toolchain / 'llvm-strip'
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/home/jade/Organized/S10+/mainline-kernel/graphics-stack/sysroot/lib/pkgconfig', '/usr/bin/pkg-config']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
